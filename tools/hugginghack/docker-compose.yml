name: hugginghack

services:
  hugginghack:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hugginghack
    restart: unless-stopped
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      - "${HUGGINGHACK_PORT:-7860}:7860"
    environment:
      APP_NAME: HuggingHack
      APP_VERSION: 1.0.0
      MODEL_STORAGE: /models
      DATA_DIR: /data
      HF_ENDPOINT: "${HF_ENDPOINT:-https://huggingface.co}"
      HF_TOKEN: "${HF_TOKEN:-}"
      MAX_CONCURRENT_DOWNLOADS: "${MAX_CONCURRENT_DOWNLOADS:-2}"
      DOWNLOAD_WORKERS_PER_JOB: "${DOWNLOAD_WORKERS_PER_JOB:-4}"
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - "${MODEL_STORAGE_PATH:-./models}:/models"
      - "./data:/data"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

