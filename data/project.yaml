# OpenTrader project reference data — single source of truth for ports, services, config, bugs
# Query via opentrader-context tool or: python3 -c "import yaml,json; d=yaml.safe_load(open('data/project.yaml')); print(json.dumps(d['known_bugs'], indent=2))"

services:
  ternary-server:
    port: 5802
    description: "llama-server (Ternary Bonsai 27B Q2_0, AMD RX 7900 GRE — harness + subagents)"
    start_cmd: |
      nohup /home/mrc/src/prismml-llama.cpp/build-hip/bin/llama-server \
        --model /home/mrc/models/ternary-bonsai-27b/Ternary-Bonsai-27B-Q2_0.gguf \
        --host 127.0.0.1 --port 5802 \
        -c 262144 --n-gpu-layers 99 \
        --flash-attn on \
        --cache-type-k q4_0 --cache-type-v q4_0 \
        --parallel 1 --cont-batching \
        --threads 8 --jinja --metrics \
        --reasoning-format deepseek --reasoning-budget 512 \
        > /tmp/llama-hip-5802.log 2>&1 &
    health_check: "curl -s http://127.0.0.1:5802/health"
    deps: []
    stop_cmd: "pkill -f 'llama-server.*5802'"

  qwen-server:
    port: 5803
    description: "llama-server (Qwen2.5-7B Q4_K_M, RTX 3070 CUDA — architect agent)"
    start_cmd: |
      CUDA_VISIBLE_DEVICES=0 nohup /home/mrc/src/prismml-llama.cpp/build/bin/llama-server \
        --model /home/mrc/models/qwen2.5-7b-instruct/Qwen2.5-7B-Instruct-Q4_K_M.gguf \
        --host 127.0.0.1 --port 5803 \
        -c 24576 --n-gpu-layers 99 \
        --cache-type-k q8_0 --cache-type-v q8_0 \
        --parallel 1 --cont-batching \
        --threads 8 --batch-size 2048 --ubatch-size 512 \
        --jinja --metrics --alias qwen2.5-7b-q4 \
        > /tmp/llama-cuda-5803.log 2>&1 &
    health_check: "curl -s http://127.0.0.1:5803/health"
    deps: []
    stop_cmd: "pkill -f 'llama-server.*5803'"

  hugginghack:
    port: 7860
    description: "Model discovery API — search/download HF models"
    start_cmd: |
      MODEL_STORAGE=/home/mrc/models DATA_DIR=/home/mrc/opentrader/tools/hugginghack/data \
        nohup python3 -m uvicorn app.main:app \
          --app-dir /home/mrc/opentrader/tools/hugginghack/backend \
          --host 127.0.0.1 --port 7860 \
          > /tmp/hugginghack.log 2>&1 &
    health_check: "curl -s http://127.0.0.1:7860/api/health"
    deps: []
    stop_cmd: "pkill -f 'uvicorn app.main'"

  harness:
    port: null
    description: "Main trading loop (harness.py via run_harness.py)"
    start_cmd: |
      cd /home/mrc/opentrader
      setsid python3 run_harness.py --live --exchange kraken --stage 2 \
        --cash 100 --max-daily-trades 500 --parallel-debate \
        --llama-host http://127.0.0.1:5802 \
        </dev/null >>/tmp/harness_watch.log 2>&1 &
      disown
    health_check: 'ps aux | grep "harness\\.py" | grep -v grep'
    deps: ["ternary-server"]
    state_files: ["data/paper_state.json", "data/agent_state.json"]
    stop_cmd: 'pkill -f "harness\\.py"'

  dashboard:
    port: 8097
    description: "FastAPI + HTMX dashboard"
    start_cmd: |
      setsid python3 /home/mrc/opentrader/dashboard.py --port 8097 \
        </dev/null >/tmp/dashboard.log 2>&1 &
      disown
    health_check: "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8097/"
    deps: ["harness"]
    stop_cmd: 'pkill -f "dashboard\\.py"'
    note: "NO --reload flag (causes uvicorn restart loops)"

  startup-script:
    description: "One-shot startup for all GPU servers + HuggingHack"
    start_cmd: "bash /home/mrc/opentrader/scripts/start-gpu-servers.sh"

model:
  ternary-bonsai-27b:
    path: "/home/mrc/models/ternary-bonsai-27b/Ternary-Bonsai-27B-Q2_0.gguf"
    port: 5802
    quant: Q2_0
    vram: "14.2GB"
    ctx_size: 262144
    gpu: "AMD RX 7900 GRE (16GB VRAM, ROCm)"
    reasoning_budget: 512
    reasoning_format: deepseek

  qwen2.5-7b:
    path: "/home/mrc/models/qwen2.5-7b-instruct/Qwen2.5-7B-Instruct-Q4_K_M.gguf"
    port: 5803
    quant: Q4_K_M
    vram: "5.1GB"
    ctx_size: 24576
    gpu: "NVIDIA RTX 3070 (8GB VRAM, CUDA)"

  qwen3-embedding:
    provider: ollama
    path: "qwen3-embedding:latest"
    vram: "4.7GB"

gpu:
  gpu0:
    name: "NVIDIA RTX 3070"
    vram: "8GB"
    backend: CUDA
    role: "architect agent (Qwen2.5-7B)"
    port: 5803
  gpu1:
    name: "AMD RX 7900 GRE"
    vram: "16GB"
    backend: ROCm
    role: "harness + subagents (Ternary Bonsai 27B)"
    port: 5802

exchange:
  active: ibkr
  mode: live_paper
  available: ["ibkr", "paper", "kraken", "coinbase", "alpaca"]

config:
  initial_capital: 100000
  active_symbols: ["SPY", "QQQ", "AAPL", "MSFT", "NVDA", "GOOGL", "AMZN", "META", "TSLA"]
  stage: 2
  default_sl_pct: 4
  default_tp_pct: 8
  max_position_cycles: 500
  trailing_stop_activation_pct: 1.5
  trailing_stop_pct: 2
  position_drawdown_pct: 5
  min_cash_reserve: 5
  kelly_fraction: 0.35
  max_position_pct: 18
  max_total_exposure_pct: 25

opencode_config:
  compaction_reserved: 16384
  compaction_threshold: 245760
  ternary_input_limit: 262144
  ternary_output_limit: 16384
  ternary_context: 262144
  qwen_context: 24576
  qwen_output: 4096
  agents:
    builder: "ternary-amd/ternary-bonsai-27b (primary)"
    architect: "qwen-cuda/qwen2.5-7b-q4 (primary)"
    manager: "ternary-amd/ternary-bonsai-27b (subagent)"
    qwen-worker: "ternary-amd/ternary-bonsai-27b (subagent)"
    modelfixer: "ternary-amd/ternary-bonsai-27b (subagent)"
  providers:
    ternary-amd: "http://localhost:5802/v1"
    qwen-cuda: "http://localhost:5803/v1"

paths:
  project_root: "/home/mrc/opentrader"
  venv: "/home/mrc/rocm_venv"
  logs: "/tmp"
  server_logs: "/tmp/llama-hip-5802.log /tmp/llama-cuda-5803.log /tmp/hugginghack.log"
  data: "/home/mrc/opentrader/data"
  models: "/home/mrc/models"
  scripts: "/home/mrc/opentrader/scripts"
  config_user: "~/.config/opencode/opencode.jsonc"
  config_project: ".opencode/opencode.json"

known_bugs:
  - id: report_risk_crash
    severity: critical
    file: tools/report_risk.py
    desc: "positions: dict vs list mismatch. s.get('positions', {}) fails when StateManager stores positions as list."
    fix: "Handle both dict and list types"

  - id: report_risk_stage_missing
    severity: critical
    file: tools/report_risk.py
    desc: "s.get('stage', '?') reads nonexistent top-level key. Stage is at models.stage."
    fix: "Read from s['models'].get('stage', '?')"

  - id: training_scheduler_starved
    severity: critical
    file: training/train_scheduler.py
    desc: "Both arXiv extraction and training eval use _last_arxiv_extract guard. Arxiv resets it, starving training eval."
    fix: "Use separate guard variables for arxiv_feature_extraction and training_eval"

  - id: news_arxiv_cache_race
    severity: high
    file: harness.py
    desc: "_news_cycle gate has no lock. Parallel debate threads can duplicate news/arxiv fetches."
    fix: "Add threading.Lock() around cache gate checks"

  - id: mcp_cycle_reset
    severity: high
    file: agent/mcp_client.py
    desc: "MCP _cycle counter resets on harness restart. Not loaded from persisted state."
    fix: "Restore _cycle from agent_state.json on startup"

  - id: sell_scoring_wrong_action
    severity: high
    file: mot/scoring.py
    desc: "SELL scoring records signal.action instead of effective_action when portfolio optimizer overrides."
    fix: "Use effective_action for SELL record fallback"

  - id: portfolio_opt_on_hold
    severity: medium
    file: risk/portfolio_optimizer.py
    desc: "Portfolio optimizer runs on HOLD cycles. Wastes compute fetching prices when all signals are HOLD."
    fix: "Skip optimization when no BUY/SELL signals exist"

  - id: no_circuit_breaker_recovery
    severity: medium
    file: harness.py
    desc: "Once circuit breaker trips, harness stops permanently. Manual restart required."
    fix: "Add auto-reset after cooldown period or manual flag"

  - id: dashboard_pva_cache
    severity: medium
    file: dashboard.py
    desc: "New symbols don't appear in price curves until enough history accumulates."
    fix: "Pad missing PVA values"

  - id: allocation_mutation_bug
    severity: high
    file: risk/portfolio_optimizer.py
    desc: "PortfolioOptimizer logs ALLOC-BUY with positive qty, but allocate_portfolio returns HOLD. ALLOC-FIXUP workaround in harness."
    fix: "Trace Allocation objects for @dataclass sharing or callback mutation"

  - id: trade_journal_empty
    severity: high
    file: harness.py
    desc: "_trade_journal has 0 entries even after fills execute. Journal never persisted, param optimizer never triggers."
    fix: "Check _trade_journal.append() code path and state write"

  - id: ternary_server_crash
    severity: high
    file: infrastructure
    desc: "Ternary server at 262K context with q4_0 cache may crash under heavy prompt load (14.2/17.2GB VRAM)."
    fix: "If crashes repeat, drop to -c 131072 (11.1GB used, 6GB safe). Monitor /tmp/llama-hip-5802.log."

  - id: opencode_config_stale
    severity: medium
    file: infrastructure
    desc: "OpenCode sessions cache config at creation time. Changes require /new session, not process restart."
    fix: "Use Ctrl+N or /new for config changes. Sessions pick up new opencode.jsonc automatically."

training:
  entry_point: "PYTHONPATH=/home/mrc/opentrader /home/mrc/rocm_venv/bin/python3 training/run_training.py"
  dry_run: "PYTHONPATH=/home/mrc/opentrader /home/mrc/rocm_venv/bin/python3 -c \"from training.finetune_cycle import run_finetune; run_finetune('/home/mrc/opentrader/data', dry_run=True)\""
  base_model: "Qwen/Qwen2.5-7B-Instruct"
  method: "Unsloth + LoRA (4-bit)"
  examples_path: "data/training/training_data.jsonl"
  examples_count: 31
  output_dir: "models/finetune/"
  status_file: "data/training/finetune_status.json"
  lock_file: "training.lock"
  vram_note: "Must stop ternary-server first (pkill -f 'llama-server.*5802'). Training needs full VRAM."
  first_run_time: "~12 min (downloads model cache — 3GB)"
  cached_run_time: "~3 min"
  eval_script: "bash training/eval_gate.sh"
  deploy_script: "bash training/deploy_gate.sh"
